{% extends "base.html" %}{% block content %}<h1>Scan History</h1><div class="card"><table><tr><th>Target</th><th>Scanned At</th><th>Duration</th><th>Services</th><th>Report</th></tr>{% for scan in scans %}<tr><td>{{ scan.target }}</td><td>{{ scan.scanned_at }}</td><td>{{ "%.2f"|format(scan.duration) }}s</td><td>{{ scan.open_services }}</td><td><a href="{{ url_for('reports',filename=scan.report_file) }}">Open</a></td></tr>{% else %}<tr><td colspan="5">No scan history yet.</td></tr>{% endfor %}</table></div>{% endblock %}
